name: Android Debug Build

on:
  push:
    branches: [ main ]
    paths: [ 'jarvis-android/**' ]
  pull_request:
    paths: [ 'jarvis-android/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-android
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check whether Gradle Wrapper already exists
        id: wrapper_check
        run: |
          if [ -f gradlew ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Provision Gradle 8.9 (bootstrap only)
        if: steps.wrapper_check.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate official Gradle Wrapper
        if: steps.wrapper_check.outputs.exists == 'false'
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Commit generated wrapper files only
        if: steps.wrapper_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.properties gradle/wrapper/gradle-wrapper.jar
          git commit -m "Add Gradle Wrapper [skip ci]"
          git push

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: jarvis-android/app/build/outputs/apk/debug/*.apk
