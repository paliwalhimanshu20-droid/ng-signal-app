name: Check Trading Signal Outcomes

on:
  schedule:
    - cron: "0,30 3-18 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run signal outcome checker
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_signals.py

      - name: Commit updated signal log
        run: |
          git config --global user.name "signal-bot"
          git config --global user.email "actions@github.com"
          git add signal_log.csv
          git diff --staged --quiet || git commit -m "Update signal outcomes [automated]"
          git push
