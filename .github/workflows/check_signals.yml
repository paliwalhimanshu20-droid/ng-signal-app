name: Check Trading Signal Outcomes

# Runs automatically on a schedule, independent of the Streamlit app.
# Checks all OPEN trades against live prices, updates the Research &
# Learning Database's live_trades table (data/research_learning.db),
# commits the change back to the repo, and sends Telegram alerts for
# any signal that hit its target or stop loss in this run.
#
# MIGRATED from signal_log.csv to research_learning.db — same schedule,
# same logic, different file committed at the end.

on:
  schedule:
    # Every 30 minutes, during NSE/MCX trading hours (IST 9:00–23:30),
    # Monday–Friday only. Cron is in UTC, IST = UTC+5:30.
    # 9:00 AM IST = 3:30 AM UTC, 11:30 PM IST = 6:00 PM UTC.
    - cron: "0,30 3-18 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

permissions:
  contents: write   # needed so the workflow can commit research_learning.db back

concurrency:
  group: research-db-writer   # SAME group name as generate_signals.yml — serializes the two workflows
  cancel-in-progress: false   # never cancel a run that's already writing to the DB; queue instead

jobs:
  check-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run signal outcome checker
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_signals.py

      - name: Commit updated database
        run: |
          git config --global user.name "signal-bot"
          git config --global user.email "actions@github.com"
          if [ -f data/research_learning.db ]; then
            git add data/research_learning.db
            git diff --staged --quiet || git commit -m "Update signal outcomes [automated]"
            git push
          else
            echo "data/research_learning.db does not exist yet — no signals have been logged. Nothing to commit."
          fi
