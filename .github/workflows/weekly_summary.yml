name: Weekly Signal Performance Report

# Runs once a week and sends a Telegram report summarizing the past 7
# days of closed trades (win rate, avg P&L, full trade list).
# Read-only — does not modify signal_log.csv.

on:
  schedule:
    # Every Saturday at 8:00 AM IST = 2:30 AM UTC Saturday
    - cron: "30 2 * * 6"
  workflow_dispatch: {}   # lets you trigger it manually anytime to test

jobs:
  weekly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Send weekly report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python weekly_summary.py
