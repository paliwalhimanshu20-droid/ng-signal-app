name: Migrate CSV to Live Trades DB (one-time)

# Manual, one-off use only — run this ONCE from the Actions tab after
# deploying the live_trades table, to bring your existing signal_log.csv
# history into research_learning.db. Safe to re-run (skips signal_ids
# already migrated), but there's no need to run it more than once.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run migration script
        run: python scripts/migrate_csv_to_live_trades.py

      - name: Commit updated database
        run: |
          git config --global user.name "signal-bot"
          git config --global user.email "actions@github.com"
          if [ -f data/research_learning.db ]; then
            git add data/research_learning.db
            git diff --staged --quiet || git commit -m "Migrate signal_log.csv history into live_trades [one-time]"
            git push
          else
            echo "data/research_learning.db was not created — check the migration script output above in the Actions log."
          fi
