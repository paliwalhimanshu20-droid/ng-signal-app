name: Update Instrument Master

# Runs the Instrument Master sync (scripts/run_update.py), which downloads
# Upstox's full instrument list, classifies every instrument (sector,
# industry, commodity group, research priority), validates the result
# through instrument_master/validation.py's severity-based rule framework
# (INFO/WARNING/FAIL), and writes data/instrument_master.db plus a
# structured JSON audit report. Commits both back to the repo so the
# Streamlit app and the Historical Intelligence Warehouse's downloader
# (NGWH-002) can resolve the instrument universe without crashing.
#
# Only a genuine FAIL-severity integrity issue stops this workflow and
# blocks the commit. WARNING-level findings (e.g. a corporate-action
# duplicate listing, an INDEX row's zero lot_size) are fully logged in the
# audit report but do not block anything — see instrument_master/validation.py
# for the full rule set and rationale.
#
# No API token needed — the Upstox instrument master file is a public
# download.

on:
  schedule:
    # Once daily, before NSE/MCX market open. Cron is UTC.
    # 7:30 AM IST = 2:00 AM UTC.
    - cron: "0 2 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

permissions:
  contents: write   # needed so the workflow can commit data/instrument_master.db back

jobs:
  update-instrument-master:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Instrument Master sync + validation
        run: python scripts/run_update.py

      # Runs even if the sync step above failed on a genuine FAIL, since
      # run_update.py writes the audit report BEFORE checking whether to
      # exit non-zero — so the failure detail is always retrievable here,
      # not just in the (ephemeral) Actions log.
      - name: Upload validation report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrument-master-validation-report
          path: data/instrument_master_validation_report.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Commit updated Instrument Master DB + validation report + history
        run: |
          git config --global user.name "instrument-master-bot"
          git config --global user.email "actions@github.com"
          if [ -f data/instrument_master.db ]; then
            git add data/instrument_master.db data/instrument_master_validation_report.json
            # data/validation_history.db is the Validation Intelligence
            # Framework's append-only cross-run history (validation_history/) —
            # committed here so trend/anomaly detection has a real baseline on
            # the NEXT scheduled run. Rows are small (a few hundred bytes each,
            # one per run); a project run daily for years stays well under 1MB.
            if [ -f data/validation_history.db ]; then
              git add data/validation_history.db
            fi
            git diff --staged --quiet || git commit -m "Update Instrument Master [automated]"
            git push
          else
            echo "data/instrument_master.db was not created — sync must have failed. Check the 'Run Instrument Master sync + validation' step above."
            exit 1
          fi

