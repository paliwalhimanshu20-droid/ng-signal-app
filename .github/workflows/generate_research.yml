name: Generate Historical Research

# Runs strategy_lab's backtest + indicator-combination analysis headlessly
# (generate_research.py -> strategy_lab.research_engine), persists results
# to the Research & Learning Database (data/research_learning.db's
# research_experiments/strategy_test_results/performance_metrics/
# market_regime_results/experiment_notes tables), and commits the change
# back to the repo.
#
# PR 8: this is the background research generation pipeline — it never
# runs inside Streamlit, never blocks Live Scan, and is completely
# separate from generate_signals.yml's live-signal path. See
# strategy_lab/research_engine.py's module docstring for exactly what
# data window this analyzes today (not 10 years yet — see that docstring).
#
# CRON DELIBERATELY NOT ENABLED YET, same reasoning and same validation
# gate generate_signals.yml used before its own cron was enabled: a
# manual dry run (and then a real run) should be reviewed before this
# runs unattended on a schedule.
#
# Shares data/research_learning.db with generate_signals.yml and
# check_signals.yml. Uses the SAME concurrency group as both of those so
# GitHub Actions queues runs behind each other instead of racing to
# commit/push the same file.

on:
  # schedule:
  #   - cron: "20 4 * * 1-5"   # once daily, IST ~9:50am, Mon-Fri — intentionally commented out, see note above
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (analyze and print results, no DB writes)"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: research-db-writer   # SAME group as generate_signals.yml / check_signals.yml
  cancel-in-progress: false

jobs:
  generate-research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Same minimal set as generate_signals.yml — strategy_lab's import
        # chain (signal_logic, upstox_client, watchlist, config) needs
        # streamlit + pandas + requests, nothing from the Warehouse's
        # duckdb/pyarrow stack.
        run: pip install streamlit pandas requests

      - name: Run research generator
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python generate_research.py

      - name: Commit updated database
        run: |
          git config --global user.name "research-bot"
          git config --global user.email "actions@github.com"
          if [ -f data/research_learning.db ]; then
            git add data/research_learning.db
            git diff --staged --quiet || git commit -m "Add research results [automated]"
            git push
          else
            echo "data/research_learning.db does not exist yet — nothing to commit."
          fi
