# NG Signal Pro — Historical Intelligence Warehouse (NGWH-001)
# Example configuration: PRODUCTION (target scale: 100+ instruments, 10+ years)

environment: production

paths:
  root_dir: "/data/ngsp/warehouse"
  instrument_master_db_path: "/data/ngsp/instrument_master.db"
  research_learning_db_path: "/data/ngsp/research_learning.db"

storage:
  parquet_compression: zstd
  row_group_size: 122880
  duckdb_memory_limit: "4GB"
  duckdb_threads: 8

scale:
  target_instrument_count: 120
  target_years_history: 10
  max_parallel_jobs: 8

logging:
  level: INFO
  format: json          # structured logs for aggregation at production scale
  max_bytes: 52428800    # 50 MB per file before rotation
  backup_count: 10
  also_console: false

checkpoint:
  enabled: true
  autosave_interval_seconds: 30
  retain_completed_checkpoints_days: 30
