# NG Signal Pro — Historical Intelligence Warehouse (NGWH-001)
# Example configuration: DEVELOPMENT
#
# Copy this to config/warehouse.yaml (relative to wherever the app runs
# from) or point NGWH_CONFIG_FILE at it. Any value can also be overridden
# via an NGWH_-prefixed environment variable, e.g.
#   NGWH_STORAGE__DUCKDB_THREADS=8
# or by passing an override dict into load_config(**overrides).

environment: development

paths:
  root_dir: "./data/warehouse"
  instrument_master_db_path: "./data/instrument_master.db"
  research_learning_db_path: "./data/research_learning.db"

storage:
  parquet_compression: zstd
  row_group_size: 122880
  duckdb_memory_limit: "1GB"
  duckdb_threads: 2

scale:
  target_instrument_count: 20      # small dev/pilot scale — bump for staging/prod
  target_years_history: 2
  max_parallel_jobs: 2

logging:
  level: DEBUG
  format: text
  also_console: true

checkpoint:
  enabled: true
  autosave_interval_seconds: 15
  retain_completed_checkpoints_days: 7
